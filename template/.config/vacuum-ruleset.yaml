# Curated vacuum ruleset for the backend OpenAPI schema.
#
# Extends vacuum's built-in OpenAPI "recommended" set, then disables two rules that are noise/false
# positives for a FastAPI-generated spec and enables a handful of opt-in best-practice rules. Three OWASP
# data-hardening rules are loaded but not yet enabled (see the TODO below). Every non-default rule carries a
# comment explaining WHY.
extends:
  - - vacuum:oas
    - recommended
  # Loads the OWASP rules with all of them off, so the few chosen below can be named and switched on; a rule
  # from a set that isn't extended is silently dropped, even when set to `true`.
  - - vacuum:owasp
    - "off"
rules:
  # DISABLED: flags identical description strings, but ours repeat legitimately — the same field
  # (e.g. SensorInfo.id) is inherited across many response models, and the same 404 text is reused
  # across endpoints. Forcing unique wording would make the docs less consistent, not better.
  description-duplication: "off"

  # DISABLED: `servers` is meaningless here — single-server, air-gapped device, no multi-environment
  # URLs to document. FastAPI's default "/ - This server" relative entry is all Swagger UI needs.
  oas3-api-servers: "off"

  # DISABLED: false positive — it does not follow `$ref`, so enum/model-typed properties
  # (severity, direction, status, measurementType, etc.) that reference a fully-typed component are wrongly
  # flagged as "missing type". Every code-level workaround trips a different recommended rule
  # (allOf -> no-unnecessary-combinator; bare $ref -> oas3-missing-example and loses the field
  # description), so disabling this single shallow rule is the cleanest option. The fields keep their
  # normal Field(description=, examples=). A FastAPI-generated spec can otherwise only trigger this on
  # `Any`-typed fields, which are rare and usually unavoidable.
  oas-missing-type: "off"

  # DISABLED: same false-positive family as `oas-missing-type` above — it checks requestBody.description
  # / response.description directly and does not follow `$ref`, so it can't see that the payload/response
  # model's own docstring already documents the body. That forced every route to hand-type a description
  # duplicating the model docstring almost verbatim. Replaced below by `request-body-description` /
  # `response-body-description`, which resolve the schema first and pass if either the body itself or its
  # (dereferenced) schema has a description.
  operation-description: "off"

  # DISABLED: same false-positive family as `operation-description` above — it only checks for an
  # `example`/`examples` key on the media type object (or, at the property level, on that property's own
  # node) and does not resolve `$ref`, so it can't see a body/response model's own field-level examples.
  # Replaced below by `request-body-example` / `response-body-example`, which resolve the schema first and
  # pass if an example exists anywhere within it.
  oas3-missing-example: "off"

  # ENABLED: guarantees every tag used by an operation is declared at the top level with real metadata —
  # this drives navigation/grouping in docs and Kiota-generated client namespaces.
  # `true` pulls vacuum's built-in definition verbatim (it's an opt-in rule, absent from `recommended`).
  openapi-tags: true

  # ENABLED: a tag with no description is useless to a consumer reading the docs — enforce a
  # human-readable purpose for each of system/debug/devices/data/alarms.
  tag-description: true

  # ENABLED: keeps each operation to exactly one tag so it appears once in generated navigation/clients
  # (multi-tagging duplicates operations across groups and confuses codegen). We already tag singly.
  operation-singular-tag: true

  # ENABLED: a POST with no documented success response is an incomplete contract; ensures every
  # create/action endpoint declares its 2xx/3xx (we already return 201) so clients know the success shape.
  post-response-success: true

  # ENABLED: correctness guard — every entry in a schema's `required` list must actually exist in
  # `properties`. Catches real bugs (typo'd/removed field left in required) that break client codegen.
  required-fields-defined: true

  # TODO: enable (set to `true`) the five OWASP data-hardening rules below, worth keeping even on an
  # air-gapped/no-auth API. Until the `vacuum:owasp` extend above was added they never ran, though set to `true`,
  # so turning them on surfaces findings projects have never had to fix: every Pydantic `int` field needs a
  # `format` and bounds (e.g. a shared `Annotated[int, Field(ge=..., le=..., json_schema_extra={"format": "int64"})]`
  # type), every `str` in a request body a `max_length` (or a `Literal`/enum), every `list` there a `max_length`, and
  # every operation its 400/422 validation response documented.
  # The rest of the OWASP pack (auth/HTTPS/rate-limit/protection-*/string-restricted) is intentionally NOT wanted
  # for this trusted air-gapped, no-auth deployment; revisit if the API is ever exposed/authed.
  owasp-define-error-validation: "off"

  # Integers must declare int32/int64 `format` so codegen picks the right numeric type.
  owasp-integer-format: "off"

  # Integers must declare min/max bounds (input validation / resource-exhaustion guard).
  owasp-integer-limit: "off"

  # Request-body strings must declare `maxLength` (or be a `const`/`enum`), the same guard for text.
  owasp-string-limit: "off"

  # Request-body arrays must declare `maxItems`, the same guard for lists.
  owasp-array-limit: "off"

  # ENABLED: path id parameters must be explicit and resource-qualified, never a bare generic
  # identifier. Bare `{id}` is ambiguous in a multi-resource spec and produces collision-prone Kiota
  # client method names (every resource collapses to `by_id`). The denylist is Tier 1 only
  # (unambiguously generic tokens). Tier 2 natural-key tokens (code|slug|name|type) are intentionally
  # excluded because they are often legitimate (e.g. /countries/{code}); add them only if wanted.
  path-no-generic-id:
    description: Path id parameters must be explicit, not a bare generic identifier.
    given: $.paths[*]~
    severity: error
    then:
      function: pattern
      functionOptions:
        notMatch: "\\{(id|pk|fk|uid|guid|uuid|oid|key|ref|hash|idx|index|num|no|identifier|value|item|object|entity|record|data|thing)\\}"

  # ENABLED: path PARAMETERS must be snake_case. The kebab-case + lowercase half of our hybrid casing
  # decision (kebab static segments, snake_case params) is ALREADY enforced by the recommended set's
  # `paths-kebab-case` rule, which flags non-kebab STATIC segments and ignores `{param}` segments
  # entirely. This rule adds the parameter half that `paths-kebab-case` does not cover. FastAPI binds a
  # path parameter's name to a Python function argument (which cannot contain hyphens), so snake_case is
  # the only practical casing for parameters.
  path-param-snake-case:
    description: Path parameters must be snake_case.
    given: $.paths[*][*].parameters[?(@.in=='path')].name
    severity: error
    then:
      function: casing
      functionOptions:
        type: snake

  # ENABLED: query parameters must be camelCase — body params are already camelCase, so matching that
  # for query params keeps frontend clients consistent instead of converting between casings per field.
  query-param-camel-case:
    description: Query parameters must be camelCase.
    given: $.paths[*][*].parameters[?(@.in=='query')].name
    severity: error
    then:
      function: casing
      functionOptions:
        type: camel

  # ENABLED (gov.au API Response): response bodies must be application/json. `application/problem+json`
  # is also allowed because custom_openapi emits RFC 7807 ProblemDetails error bodies with that media
  # type. Fires zero violations against the current snapshot.
  response-media-type-json:
    description: Response bodies must be application/json (or application/problem+json for errors).
    given: $.paths[*][*].responses[*].content[*]~
    severity: error
    then:
      function: pattern
      functionOptions:
        match: "^application/(json|problem\\+json)$"

  # ENABLED (Zalando 176, "MUST support problem JSON", https://opensource.zalando.com/restful-api-guidelines/#176):
  # every documented error response (each 4xx and 5xx, and the `default` catch-all) is application/problem+json,
  # the media type the exception handlers send, so a client generated from the schema reads errors as the
  # ProblemDetails they are. Narrower than response-media-type-json above, which also lets an error be plain JSON.
  # Uses .config/vacuum-functions/errorResponsesProblemJson.js.
  error-responses-problem-json:
    description: Error responses must be application/problem+json.
    given: $.paths[*][*].responses
    severity: error
    then:
      function: errorResponsesProblemJson

  # ENABLED (gov.au API Request): request bodies must be application/json. Fires zero violations against
  # the current snapshot.
  request-media-type-json:
    description: Request bodies must be application/json.
    given: $.paths[*][*].requestBody.content[*]~
    severity: error
    then:
      function: pattern
      functionOptions:
        match: "^application/json$"

  # ENABLED: POST request bodies must not REQUIRE an id — the backend generates it (a client may still
  # supply an optional one). This targets each entry of the resolved request-body schema's `required`
  # array and asserts none is literally "id"; if `required` is absent, no nodes match and the rule
  # passes. (A schema-of-schema `not/contains` approach was tried first but vacuum reported it as a
  # false positive on every POST body, so this pattern-based form is used instead.)
  create-body-no-required-id:
    description: POST request bodies must not require an id (backend-generated).
    given: $.paths[*].post.requestBody.content.*.schema.required[*]
    resolved: true
    severity: error
    then:
      function: pattern
      functionOptions:
        notMatch: "^id$"

  # ENABLED (gov.au Naming: nouns not verbs). The recommended set's `no-http-verbs-in-path` already
  # catches HTTP-method names used as path segments; this adds the non-HTTP action verbs it does not
  # cover. Fires zero violations against the current snapshot.
  no-action-verbs-in-path:
    description: Path segments must be nouns, not action verbs.
    given: $.paths[*]~
    severity: error
    then:
      function: pattern
      functionOptions:
        notMatch: "/(list|create|add|update|edit|remove|fetch|retrieve|make)(-|/|$)"

  # ENABLED (gov.au API Response): a 201 Created must return the new resource's Location. This fires on
  # POST operations that declare a 201 response, so genuine resource creates (add device, create
  # threshold, create view) declare + emit a Location header. Non-create POST actions should return a
  # non-201 success (e.g. push measurements returns 202 Accepted) so this rule does not apply to them.
  # (A `function: schema` form with a nested `required: [Location]` was tried first but vacuum reported
  # it as a false positive even when the header was present, so this truthy field check is used instead.)
  location-header-on-201:
    description: 201 Created responses must declare a Location header.
    given: $.paths[*].post.responses['201']
    severity: error
    then:
      field: headers.Location
      function: truthy

  # ENABLED (AGENTS.md: every status code a route raises is documented in its `responses`): an operation whose path
  # names a resource by parameter can be asked for one that doesn't exist, so it documents the 404 it answers with.
  # Stricter than Zalando 151, which lets a standard 404 go undocumented: a client generated from the schema only
  # gets a typed error for the responses the schema lists.
  path-parameter-operations-document-404:
    description: An operation on a path with a parameter must document a 404 response.
    given: $.paths[?(@property.match(/\{/))][get,put,post,delete,options,head,patch,trace].responses
    severity: error
    then:
      field: "404"
      function: truthy

  # ENABLED (gov.au Naming: plural resources). Static path segments should be plural resource nouns.
  # Declarative casing/pattern rules cannot pluralize, so this uses a custom JavaScript function
  # (.config/vacuum-functions/resourcesPlural.js) run via `vacuum lint -f .config/vacuum-functions`. The
  # check is heuristic: it flags a static segment only when it is clearly singular (does not end in "s")
  # and is not in the function's ALLOWLIST of non-collection segments (namespaces, actions, uncountable
  # nouns). Tune that allowlist in the JS file rather than here.
  resources-plural:
    description: Path resource segments should be plural nouns.
    given: $.paths[*]~
    severity: error
    then:
      function: resourcesPlural

  # ENABLED: replaces the requestBody half of the built-in `operation-description` (disabled above).
  # Uses .config/vacuum-functions/bodyDescription.js, which resolves the requestBody's schema and passes
  # if either the requestBody itself or its (dereferenced) schema has a description — so a payload
  # model's docstring is enough, no hand-typed duplicate needed.
  request-body-description:
    description: Request bodies must have a description, either their own or via their schema's docstring.
    given: $.paths[*][*].requestBody
    severity: error
    then:
      function: bodyDescription

  # ENABLED: same replacement as `request-body-description` above, for response bodies.
  response-body-description:
    description: Response bodies must have a description, either their own or via their schema's docstring.
    given: $.paths[*][*].responses[*]
    severity: error
    then:
      function: bodyDescription

  # ENABLED: replaces the requestBody half of the built-in `oas3-missing-example` (disabled above). Uses
  # .config/vacuum-functions/bodyExample.js, which resolves the requestBody's schema and passes if an
  # example exists on the body itself or anywhere within its (dereferenced) schema — so field-level
  # `Field(examples=[...])` on the payload model is enough, no hand-typed duplicate needed.
  request-body-example:
    description: Request bodies must have an example, either their own or via their schema's fields.
    given: $.paths[*][*].requestBody
    severity: error
    then:
      function: bodyExample

  # ENABLED: same replacement as `request-body-example` above, for response bodies.
  response-body-example:
    description: Response bodies must have an example, either their own or via their schema's fields.
    given: $.paths[*][*].responses[*]
    severity: error
    then:
      function: bodyExample

  # ENABLED (gov.au Naming Conventions, https://api.gov.au/sections/naming-conventions.html): a date/time field's
  # name ends in its type, `DateTime` for an instant, `Date` for a calendar day, `Time` for a time of day, and each
  # suffix requires that format, so a reader of the raw JSON, a CSV export or a database column knows whether time
  # zones apply without the schema. Applied to query and path parameters too, since gov.au has their names follow
  # the field names. Chosen over Zalando 235's `…At` style (refused outright, along with `…Timestamp`); it also
  # covers Zalando 169 ("MUST use standard formats for date and time properties"). Uses dateTimeSuffix.js.
  date-time-suffix:
    description: A date/time field must end in DateTime, Date or Time, matching its format.
    given:
      - $.components.schemas[*]
      - $.paths[*][*].parameters[*]
    severity: error
    then:
      function: dateTimeSuffix

  # ENABLED (gov.au Naming Conventions, https://api.gov.au/sections/naming-conventions.html, "The object and field
  # definition MUST be the same for the request and response body"), widened to the whole API: a property name has
  # one definition (type, format, `$ref` target, item type, enum) in every component schema, nullability and
  # required-ness aside. Uses consistentPropertyTypes.js. Left out are schemas whose field names we don't choose:
  # FastAPI's generated validation-error models, and ProblemDetails and its subclass ValidationProblemDetails, whose
  # `status` and `detail` RFC 9457 names.
  consistent-property-types:
    description: A property name must have the same type in every schema.
    given: $.components.schemas
    resolved: false
    severity: error
    then:
      function: consistentPropertyTypes
      functionOptions:
        ignoreSchemas:
          - HTTPValidationError
          - ValidationError
          - ProblemDetails
          - ValidationProblemDetails

  # ENABLED (Zalando 110, "MUST always return JSON objects as top-level data structures",
  # https://opensource.zalando.com/restful-api-guidelines/#110): no response body may be a bare JSON array,
  # so metadata such as pagination can later be added beside the items without breaking clients.
  # `resolved: true` follows `$ref`, so a component that is itself an array (a Pydantic RootModel[list[...]])
  # is caught as well as an inline `list[...]` return type.
  response-body-not-top-level-array:
    description: Response bodies must be JSON objects, never a top-level array.
    given: $.paths[*][*].responses[*].content[*].schema
    resolved: true
    severity: error
    then:
      field: type
      function: pattern
      functionOptions:
        notMatch: "^array$"

  # ENABLED (Zalando 110, as above; the key name is from gov.au API Responses, "Operations on a Resource
  # Collection", which requires a collection be returned in a "data" array): a GET listing a collection
  # holds its items in a top-level `data` array, so every collection has the same path to its items. Uses
  # .config/vacuum-functions/collectionInData.js, which tells a collection from a single resource by the
  # path's last segment (static, not `{param}`) and from a static singleton by the body having an array.
  collection-in-data:
    description: A GET listing a collection must return its items in a top-level `data` array.
    given: $.paths
    resolved: true
    severity: error
    then:
      function: collectionInData

  # ENABLED (Zalando 112, "SHOULD use open-ended list of values (via examples) for enumeration types",
  # https://opensource.zalando.com/restful-api-guidelines/#112): a closed `enum` makes every added value a
  # breaking change for clients, while an extensible enum tells them up front to handle values they don't know.
  # Whether an enum is open or closed is a per-enum judgment lint can't make, so this only checks that a schema
  # declared open, by a description starting "Extensible enum.", has the shape Zalando gives it: a string
  # listing its known values in `examples`, with no `enum` that would close it again.
  extensible-enum-shape:
    description: An extensible enum must be a string listing its known values in `examples`, with no `enum`.
    given: $..[?search(@.description, '^Extensible enum[.]')]
    severity: error
    then:
      - field: type
        function: pattern
        functionOptions:
          match: "^string$"
      - field: examples
        function: truthy
      - field: enum
        function: falsy

  # ENABLED (Zalando 115, "MUST not use URL versioning", https://opensource.zalando.com/restful-api-guidelines/#115):
  # a `/v2/` path makes the new version a different resource, so clients must rewrite every URL to move and
  # links stored by one version break in the other. Evolve the API compatibly instead. Chosen over gov.au
  # API Versioning (https://api.gov.au/sections/api-versioning.html), which requires `/v{MAJOR}` in the URI.
  no-url-versioning:
    description: Paths must not contain a version segment such as /v1/.
    given: $.paths[*]~
    severity: error
    then:
      function: pattern
      functionOptions:
        notMatch: "(^|/)v[0-9]+(/|$)"

  # ENABLED (Zalando 116, "MUST use semantic versioning", https://opensource.zalando.com/restful-api-guidelines/#116;
  # gov.au API Versioning also MUSTs semver): `info.version` is MAJOR.MINOR.PATCH, with no pre-release or build
  # suffix, so a client can tell a breaking release from a compatible one. It comes from pyproject.toml's version.
  info-version-semver:
    description: info.version must be a MAJOR.MINOR.PATCH semantic version.
    given: $.info.version
    severity: error
    then:
      function: pattern
      functionOptions:
        match: "^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$"

  # ENABLED (Zalando 120, "SHOULD pluralize array names", https://opensource.zalando.com/restful-api-guidelines/#120;
  # gov.au Naming Conventions says the same): an array property's name is a plural noun. Heuristic, via
  # .config/vacuum-functions/pluralArrayNames.js: it passes names ending in "s" or in one of `pluralWords` (add an
  # irregular plural there rather than exempting it per project). FastAPI's validation-error models are left out.
  plural-array-names:
    description: Array properties must be named with a plural noun.
    given: $.components.schemas
    resolved: false
    severity: error
    then:
      function: pluralArrayNames
      functionOptions:
        pluralWords:
          - data
          - children
          - people
          - criteria
          - media
        ignoreSchemas:
          - HTTPValidationError
          - ValidationError

  # ENABLED (Zalando 122, "MUST not use `null` for boolean properties",
  # https://opensource.zalando.com/restful-api-guidelines/#122): a `bool | None` field is a three-valued
  # flag whose null rarely means anything a client can act on; give it a default instead. Uses
  # .config/vacuum-functions/nullableType.js, run over every component schema and every operation parameter.
  # Boolean names may start with `is`/`has`: gov.au Naming Conventions' SHOULD NOT is deliberately not enforced,
  # since the bare adjective or noun is often ambiguous (`raw` beside a measurement value, `more` for pagination).
  no-nullable-boolean:
    description: Boolean properties must not be nullable.
    given:
      - $.components.schemas[*]
      - $.paths[*][*].parameters[*]
    severity: error
    then:
      function: nullableType
      functionOptions:
        type: boolean

  # ENABLED (Zalando 123, "MUST use same semantics for `null` and absent properties",
  # https://opensource.zalando.com/restful-api-guidelines/#123): the rule is about meaning, which lint can't
  # see, so this checks the shape that lets absent and null differ: a property both optional and nullable.
  # Each property is either required and nullable (always sent, may be null) or optional and never null
  # (in Pydantic, `X | SkipJsonSchema[None] = None`). Uses .config/vacuum-functions/optionalNullable.js.
  no-optional-nullable:
    description: A property must not be both optional and nullable.
    given: $.components.schemas[*]
    severity: error
    then:
      function: optionalNullable

  # ENABLED (Zalando 124, "SHOULD not use `null` for empty arrays",
  # https://opensource.zalando.com/restful-api-guidelines/#124): an empty array already says "none", so a
  # `list[X] | None` field gives clients two ways to say the same thing. Uses nullableType.js, as Zalando 122 does.
  no-nullable-array:
    description: Array properties must not be nullable; use an empty array.
    given:
      - $.components.schemas[*]
      - $.paths[*][*].parameters[*]
    severity: error
    then:
      function: nullableType
      functionOptions:
        type: array

  # ENABLED (Zalando 132, "SHOULD use kebab-case with uppercase separate words for HTTP headers",
  # https://opensource.zalando.com/restful-api-guidelines/#132): header names are case-insensitive on the wire,
  # but the spec and generated clients show them as written, so one style (`Content-Type`, `Location`) keeps
  # them consistent. Abbreviations stay uppercase (`X-Flow-ID`, `ETag`). FastAPI derives a header parameter's
  # name in lowercase (`x_token` becomes `x-token`), so declare it with `Header(alias="X-Token")`.
  header-names-capitalized-kebab-case:
    description: HTTP header names must be capitalized words joined by hyphens, like Content-Type.
    given:
      - $.paths[*][*].parameters[?(@.in=='header')].name
      - $.paths[*][*].responses[*].headers[*]~
    severity: error
    then:
      function: pattern
      functionOptions:
        match: "^[A-Z][A-Za-z0-9]*(-[A-Z0-9][A-Za-z0-9]*)*$"

  # ENABLED (Zalando 136, "MUST use normalized paths without empty path segments and trailing slashes",
  # https://opensource.zalando.com/restful-api-guidelines/#136): the recommended set already rejects a
  # trailing slash (path-keys-no-trailing-slash) and an empty `{}` (path-declarations-must-exist); this adds
  # the empty segment (`//`) neither catches. FastAPI serves "/a//b" and "/a/b" as different routes.
  no-empty-path-segments:
    description: Paths must not contain empty segments.
    given: $.paths[*]~
    severity: error
    then:
      function: pattern
      functionOptions:
        notMatch: "//"

  # ENABLED (Zalando 148, "MUST use HTTP methods correctly", https://opensource.zalando.com/restful-api-guidelines/#148):
  # GET and DELETE carry no request body. HTTP gives a body on them no defined meaning, so proxies, caches and client
  # libraries may drop it; pass what they need in the path or query instead.
  no-body-on-get-or-delete:
    description: GET and DELETE operations must not have a request body.
    given: $.paths[*][get,delete]
    severity: error
    then:
      field: requestBody
      function: falsy

  # ENABLED (Zalando 150, "SHOULD only use most common HTTP status codes",
  # https://opensource.zalando.com/restful-api-guidelines/#150): no response uses a code Zalando's list marks "do not
  # use", each having no good use in a REST API (206 Partial Content is not for pagination, 408 is for connections,
  # not APIs). Codes missing from the list stay allowed, as Zalando allows them when the response describes them.
  # Redirects are no-redirect-responses' job and unofficial codes official-status-codes'. 422 is marked "do not use"
  # too, in favor of 400, but is allowed: FastAPI answers request validation failures with it.
  no-discouraged-status-codes:
    description: Responses must not use a status code Zalando marks "do not use".
    given: $.paths[*][*].responses[*]~
    severity: error
    then:
      function: pattern
      functionOptions:
        notMatch: "^(205|206|408|417|424|505|511)$"

  # TODO: uncomment to enable (Zalando 171, "MUST define a format for number and integer types",
  # https://opensource.zalando.com/restful-api-guidelines/#171): every `number` declares float, double or decimal,
  # so a client knows which floating-point type to decode into; the integer half is owasp-integer-format's.
  # Commented out rather than "off" because vacuum can't define a custom rule and leave it disabled. Pydantic emits
  # no format for `float`, so before enabling, have custom_openapi add `format: double` to every bare `number` (a
  # Python float is always an IEEE 754 double). Uses .config/vacuum-functions/numberFormat.js.
  # number-format:
  #   description: Numbers must declare a float, double or decimal format.
  #   given:
  #     - $.components.schemas[*]
  #     - $.paths[*][*].parameters[*]
  #   severity: error
  #   then:
  #     function: numberFormat

  # ENABLED (Zalando 174, "MUST use common field names and semantics",
  # https://opensource.zalando.com/restful-api-guidelines/#174): an identifier (`id`, `…Id`, a path parameter's
  # `…_id`) is an opaque string, and `…Ids` an array of them. Not a UUID requirement (Zalando 144 discourages UUIDs
  # unless needed): an autoincrement key is sent as "42". Uses .config/vacuum-functions/stringIds.js.
  string-ids:
    description: Identifiers must be strings, and arrays of identifiers arrays of strings.
    given:
      - $.components.schemas[*]
      - $.paths[*][*].parameters[*]
    severity: error
    then:
      function: stringIds

  # ENABLED (Zalando 240, "SHOULD declare enum values using UPPER_SNAKE_CASE string",
  # https://opensource.zalando.com/restful-api-guidelines/#240): one casing for every enum value, so a client
  # never has to guess whether a status is `ok`, `Ok` or `OK`. vacuum's `macro` casing is UPPER_SNAKE_CASE.
  # Covers the known values of an extensible enum (see extensible-enum-shape) as well as a closed `enum`.
  enum-values-upper-snake-case:
    description: Enum values must be UPPER_SNAKE_CASE.
    given:
      - $..enum[*]
      - $..[?search(@.description, '^Extensible enum[.]')].examples[*]
    severity: error
    then:
      function: casing
      functionOptions:
        type: macro

  # ENABLED (Zalando 243, "MUST use official HTTP status codes", https://opensource.zalando.com/restful-api-guidelines/#243):
  # every response code is registered in the IANA HTTP Status Code Registry
  # (https://www.iana.org/assignments/http-status-codes/), so clients and proxies know what it means; a vendor code
  # such as nginx's 499 does not. Left out: 306 and 418 (registered as unused), 510 (obsoleted) and 104 (temporary,
  # expired). `default` and the OpenAPI ranges (`4XX`) are allowed.
  official-status-codes:
    description: Responses must use a status code registered with IANA.
    given: $.paths[*][*].responses[*]~
    severity: error
    then:
      function: pattern
      functionOptions:
        match: "^(10[0-3]|20[0-8]|226|30[0-57-8]|40[0-9]|41[0-7]|42[1-689]|431|451|50[0-8]|511|[1-5]XX|default)$"

  # ENABLED (Zalando 251, "SHOULD not use redirection codes", https://opensource.zalando.com/restful-api-guidelines/#251):
  # clients follow redirects inconsistently (some not at all for non-GET requests, older ones turn a redirected POST
  # into a GET), and every case has a direct answer: keep a moved URL working or return 404/410, answer a repeated
  # idempotent POST with 200 and Location, a duplicate create with 409. 304 Not Modified is caching, not a redirect.
  no-redirect-responses:
    description: Operations must not respond with a 3xx redirect (304 Not Modified is allowed).
    given: $.paths[*][*].responses[*]~
    severity: error
    then:
      function: pattern
      functionOptions:
        notMatch: "^3(0[0-35-9]|[1-9][0-9]|XX)$"
