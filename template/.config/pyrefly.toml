# ============== WARNING ==============================================================================
# File is managed by copier template: gh:LabAutomationAndScreening/copier-base-template.git
# See .config/.copier-managed-files.json for details.
#
# You are welcome to make changes to this file in your repo if they are custom to your project,
# but if the change should be shared with other projects, please backport it to the template repo.
# =====================================================================================================
project-excludes = [
    # paths are relative to this config file (in .config/), so prefix with ../ to anchor at the repo root
    # excludes managed by this repository
    "../**/template",

    # excludes managed by template
    "../**/vendor_files",
    "../**/generated",
    "../**/copier_template_resources",
    "../**/.claude/plugins", # similar to vendor_files, but these are gitignored and can contain arbitrary code, so exclude from type checking but not mutation testing
]
# without this explicit "project-includes" and "search-path", pyrefly struggles to understand the tests folder
project-includes = [
                    "../backend/src",
                    "../backend/tests"
                  ]
# "../backend" is needed so the tests package (rooted at backend/) resolves relative imports;
# without it pyrefly infers the import root from this config's dir (.config/) and can't name the test modules
search-path = ["../backend/src", "../backend"]
disable-project-excludes-heuristics = true # with this being enabled by default, pyrefly thinks the src is excluded because it's an editable local install
python-platform = "linux"
infer-with-first-use = false # more similar to pyright. must define the empty list type when instantiated
preset = "all"
spec-compliant-overloads = true # not sure exactly what this does, but seems like a good idea to be more spec compliant
ignore-errors-in-generated-code = true # not sure yet how effective this is

[errors]
no-access = "ignore" # (already covered by ruff SLF001)
# reportMissingTypeStubs=false in pyright
untyped-import = "ignore"
unannotated-return = "ignore" # ruff ANN2xx already requires this, but with suppress-none-returning so that None-returning functions don't need the noise. pyrefly has no equivalent option---the error kind is all-or-nothing.
# The two `Any`-propagation checks below are unworkable against JSON-shaped data: FastAPI's get_openapi()
# returns dict[str, Any], and every response.json() in a test is Any, so anything indexed or called off one
# of those becomes an implicit Any that these flag. Note that `no-any-return-implicit` is deliberately NOT
# ignored: it fires only where such a value escapes through a declared return type, which is exactly the
# boundary worth narrowing at.
unknown-variable-type = "ignore"
unknown-argument-type = "ignore"
# The check keeps a distributed library's public API deliberate: consumers should only reach symbols the
# package explicitly re-exports via __all__ or a redundant alias. This project is an application — nothing
# imports backend_api from outside the repo, and its only real API surface is the HTTP interface — so every
# importer is in-repo and the __all__ bookkeeping buys nothing.
implicit-reexport = "ignore"

[[sub-config]]
matches = "../**/tests/**"

[sub-config.errors]
implicitly-defined-attribute = "ignore" # doesn't make any sense for test cases. See https://github.com/microsoft/pyright/discussions/4834#discussioncomment-8496931
